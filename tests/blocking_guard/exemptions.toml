# 事件循环阻塞的永久豁免：只收应用启动与关停路径上的一次性阻塞，每条写明理由。
# 条目格式：<文件>::<最近的 lib/server async 函数>。
# 请求、任务、轮询路径上的阻塞不进这里，没有别的豁免途径：修掉它。
# 完整运行时本次未触发的条目会让会话失败：启动与关停路径改了，就同步删掉对应条目。
# 每条豁免都必须由 tests/unit 下的用例触发：CI 的 unit job 带 --blocking-guard-expect-all-exemptions，
# 只跑 tests/unit 也要求每条都触发，否则报它过期。

[[exemption]]
key = "server/app.py::lifespan"
reason = "应用生命周期本身：启动时的沙箱与 Docker 探测、日志文件处理器挂载、首次生成的初始管理员密码写入数据根，关停时的收尾；每个进程各执行一次。"

[[exemption]]
key = "server/app.py::_migrate_source_encoding_on_startup"
reason = "只由 lifespan 启动步骤调用：扫描项目目录、迁移旧源文件编码，每个进程一次。"

[[exemption]]
key = "lib/agent/agent_session_store/import_local.py::migrate_local_transcripts_to_store"
reason = "只由 lifespan 启动步骤调用：一次性把本地会话转录导入存储，靠标记文件只执行一次。"
