name: Docker Release

# v* tag 触发的正式发布：双架构漏洞闸门 → 多架构构建 → semver + latest 标签，
# 附带 SBOM 与 provenance attestation。镜像总是推送 ghcr；仓库配置了 DOCKERHUB_USERNAME
# 与 DOCKERHUB_TOKEN 时，同一次构建再推送 Docker Hub，未配置时跳过 Docker Hub。
# GitHub Release 由 release-please 创建，此处不再重复生成。
# 镜像发布成功后触发目录数据仓库（ArcReel/arcreel-catalog）构建一次。

on:
  push:
    tags: ["v*"]
  # release-please 用 GITHUB_TOKEN 发版时，它建立的 tag 不会触发 push 事件，
  # 由 release-please.yml 直接调用本工作流
  workflow_call:
    inputs:
      tag:
        description: 要发布的版本 tag（如 v0.36.0）
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      # 只给上游仓库触发目录数据构建用；上游由 tag 推送触发，不经调用路径
      RELEASE_PLEASE_APP_CLIENT_ID:
        required: false
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: false
  # 为已存在的版本 tag 补发镜像
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本 tag（如 v0.36.0）
        required: true
        type: string

# 不同 v* tag 并发运行时，后完成的旧版本会覆盖 latest/{{major}} 等可变标签，故串行执行。
# queue: max 保留全部排队 tag：默认的 queue: single 每组只留一个 pending 运行，连续推多个
# tag 会丢掉中间版本的发布。
concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  # tag 推送时取触发的 tag，被调用或手动运行时取输入的 tag
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        id: tag
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::不是版本 tag：${RELEASE_TAG}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # 被调用或手动运行时 github.sha 是触发分支的提交，不一定是 tag 指向的提交
      - name: Resolve release commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Docker Hub 命名空间与 GitHub 组织同名，两个 registry 共用这一份小写仓库名；
      # fork 因此自动指向自己的命名空间，不会继承上游的推送目标
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      # 按 ISO 周生成 APT_REFRESH，使 Dockerfile 的系统包层每周失效一次并重新 apt-get upgrade
      - name: Compute apt refresh key
        id: apt
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 闸门逐架构构建并扫描：架构间基础镜像层与二进制包可能不同，
      # 只扫 amd64 会放过仅存在于 arm64 变体的可修复漏洞。构建层进
      # gha 缓存，最终推送步骤直接复用
      - name: Build amd64 image for release gate scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ steps.rev.outputs.sha }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max,ignore-error=true

      - name: Build arm64 image for release gate scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ steps.rev.outputs.sha }}
          platforms: linux/arm64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,scope=release-arm64,mode=max,ignore-error=true

      - name: Trivy release gate amd64 (CRITICAL with fix available blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ steps.rev.outputs.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy release gate arm64 (CRITICAL with fix available blocks release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ steps.rev.outputs.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy HIGH report amd64 (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-amd64-${{ steps.rev.outputs.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy HIGH report arm64 (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:scan-arm64-${{ steps.rev.outputs.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
            name=docker.io/${{ env.IMAGE_NAME_LC }},enable=${{ env.DOCKERHUB_ENABLED }}
          # 被调用或手动运行时没有 tag 推送事件，版本号一律取 RELEASE_TAG；
          # latest 也不交给 latest=auto（它只认 tag 推送事件），只在稳定版本推送，
          # 预发布 tag（如 v1.2.3-rc.1）只推版本标签
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.stable }}

      - name: Build & push multi-arch image with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.week }}
            BUILD_COMMIT=${{ steps.rev.outputs.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64

      # 双推是同一次构建的产物，digest 理论上必然相同；这一步是「同步确实发生了」
      # 的唯一凭证，逐一核对 metadata-action 产出的每个标签——只验版本标签会放过
      # latest / {{major}} 在某个 registry 未落地的情况，而 latest 正是默认拉取入口
      - name: Assert every pushed tag resolves to the build digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "build digest: ${BUILD_DIGEST}"
          failed=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            if [ "$digest" = "$BUILD_DIGEST" ]; then
              printf '  ok   %s\n' "$tag"
            else
              printf '  FAIL %s -> %s\n' "$tag" "$digest"
              failed=1
            fi
          done <<< "$TAGS"
          if [ "$failed" -ne 0 ]; then
            echo "::error::pushed tags diverge from the build digest"
            exit 1
          fi

      # 镜像全部落地后触发目录数据仓库构建：它按 ArcReel 最新发布版本，放出此前因最低应用版本暂缓的供应商模型。
      # 放在镜像发布之后，是为了不出现「数据已放出、镜像还没就绪」的空档。fork 的发版不触发上游仓库
      - name: Create App token for catalog build
        id: catalog-token
        if: github.repository == 'ArcReel/ArcReel'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ArcReel
          repositories: arcreel-catalog
          permission-actions: write

      - name: Trigger catalog build
        if: github.repository == 'ArcReel/ArcReel'
        env:
          GH_TOKEN: ${{ steps.catalog-token.outputs.token }}
        run: gh workflow run build.yml -R ArcReel/arcreel-catalog --ref main
